<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FIVE STAR 2 - Gateway</title>
    
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        (function() {
            function applyTheme() {
                const savedTheme = localStorage.getItem('app-theme');
                const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                const isDark = savedTheme === 'dark' || (!savedTheme && systemDark);
                
                // Terapkan ke HTML (untuk CSS Variables)
                document.documentElement.classList.toggle('dark-theme', isDark);
                
                // Terapkan ke Body jika sudah tersedia
                if (document.body) {
                    document.body.classList.toggle('dark-theme', isDark);
                }
            }
    
            // Jalankan langsung untuk HTML
            applyTheme();
    
            // Jalankan ulang saat DOM selesai dimuat agar Body juga mendapatkan kelasnya
            window.addEventListener('DOMContentLoaded', applyTheme);
    
            // Pantau perubahan tema sistem secara real-time
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
                if (!localStorage.getItem('app-theme')) applyTheme();
            });
        })();
    </script>
    
    <style>
        .loader-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color); /* Mengikuti tema main.css */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 30000;
        }
        .ios-spinner {
            width: 35px;
            height: 35px;
            border: 3px solid rgba(142, 142, 147, 0.2);
            border-top-color: #007AFF;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="splashScreen" class="loader-container">
        <div class="ios-spinner"></div>
    </div>

    <div id="app-root"></div>

    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-database-compat.js"></script> <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>

    <script src="firebase.js"></script>
    <script src="main.js"></script>
    <script src="login.js"></script>
    <script src="register.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. SENSOR TEMA OTOMATIS (Mendeteksi pengaturan bawaan HP)
            const savedTheme = localStorage.getItem('app-theme');
            const sensorSistemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

            // Logika: Jika user pernah atur 'dark', ATAU HP-nya mode gelap & user belum atur manual
            if (savedTheme === 'dark' || (!savedTheme && sensorSistemDark)) {
                document.body.classList.add('dark-theme');
            }

            // 2. SENSOR REAL-TIME (Jika tema HP diubah saat sedang menatap layar login)
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
                const userManualTheme = localStorage.getItem('app-theme');
                if (!userManualTheme) { // Hanya bekerja jika user belum pernah mengklik ikon bulan di dashboard
                    const logoElement = document.getElementById('loginLogo');
                    if (event.matches) {
                        document.body.classList.add('dark-theme');
                        if (logoElement) logoElement.src = 'fs2-white.png';
                    } else {
                        document.body.classList.remove('dark-theme');
                        if (logoElement) logoElement.src = 'fs2-black.png';
                    }
                }
            });

            // 3. CEK SESI LOGIN (Navigasi)
            const sessionActive = localStorage.getItem('isLoggedIn');

            setTimeout(() => {
                if (sessionActive === 'true') {
                    window.location.href = 'dashboard.html';
                } else {
                    const loader = document.getElementById('splashScreen');
                    if (loader) {
                        loader.style.opacity = '0';
                        loader.style.transition = 'opacity 0.4s ease';
                        
                        setTimeout(() => {
                            loader.style.display = 'none';
                            if (typeof inisialisasiLogin === 'function') {
                                inisialisasiLogin();
                            }
                        }, 400);
                    } else {
                        // Jaga-jaga jika splash screen tidak ada
                        if (typeof inisialisasiLogin === 'function') {
                            inisialisasiLogin();
                        }
                    }
                }
            }, 800);
        });
    </script>
</body>
</html>
